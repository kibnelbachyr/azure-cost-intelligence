name: Offline recommendation checks
on:
  pull_request:
  push:
    branches:
      - main
      - claude/azure-cost-optimization-agent-AUSUm
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Credential-free standard-library regressions
        run: python -m unittest discover -s tests -v
      - name: Install locked application in isolated environment (PyPI only)
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -m pip install --no-deps -r requirements.lock.txt
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: Verify exact application versions
        run: python scripts/verify_dependency_lock.py
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Verify synthetic provider HTTP contracts
        run: python -m unittest discover -s sdk_tests -v
      - name: Verify Foundry Responses HTTP contract
        run: python -m unittest discover -s foundry_tests -v
      - name: Run versioned FinOps conformance evaluation
        id: finops_eval
        run: python -m evaluation.run --repeat 3 --output evaluation-report.json
      - name: Upload synthetic evaluation report
        if: always() && steps.finops_eval.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: finops-conformance-v1
          path: evaluation-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify CLI import and argument parser
        run: python -m src.main --help
      - name: Audit locked application dependencies (PyPI advisory database)
        run: |
          python -m venv .venv-audit
          .venv-audit/bin/python -m pip install pip-audit==2.9.0
          .venv-audit/bin/python -m pip_audit --requirement requirements.lock.txt --no-deps --disable-pip --strict --vulnerability-service pypi
